name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Integration tests start PostgreSQL in Docker via Testcontainers
      - name: Build and test
        working-directory: spring-boot
        run: mvn -B verify
